$kind: http-request
name: Update Ability by Name
method: PATCH
url: '{{baseUrl}}/api/abilities/:name'
description: Update an ability by name
order: 5000
params:
  - type: path
    key: name
    value: static
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Static",
      "description": "May paralyze the attacker on contact. Updated description."
    }

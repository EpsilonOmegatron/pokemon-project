$kind: http-request
name: Manage Pokemon Abilities
method: PATCH
url: "{{baseUrl}}/api/pokemon/:name/abilities"
description: "Add or remove abilities from a Pokemon. Action must be one of: ADD, REMOVE"
order: 6000
pathVariables:
  name: pichu
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "abilitiesOrMoves": ["Static"],
      "action": "ADD"
    }

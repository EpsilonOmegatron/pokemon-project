$kind: http-request
name: Manage Pokemon Moves
method: PATCH
url: "{{baseUrl}}/api/pokemon/:name/moves"
description: "Add or remove moves from a Pokemon. Action must be one of: ADD, REMOVE"
order: 5000
pathVariables:
  name: pichu
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "abilitiesOrMoves": ["Thunder Wave"],
      "action": "ADD"
    }

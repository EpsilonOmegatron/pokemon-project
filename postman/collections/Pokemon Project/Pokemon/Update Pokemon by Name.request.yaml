$kind: http-request
name: Update Pokemon by Name
method: PATCH
url: "{{baseUrl}}/api/pokemon/:name"
description: Update a Pokemon's details by name. All fields are optional.
order: 4000
pathVariables:
  name: pikachu
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "evolvesFrom": "Pichu"
    }

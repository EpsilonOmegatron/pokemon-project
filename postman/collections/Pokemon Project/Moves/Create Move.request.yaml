$kind: http-request
name: Create Move
method: POST
url: "{{baseUrl}}/api/moves"
description: "Create a new move. damageCategory must be one of: PHYSICAL, SPECIAL, STATUS. type must be one of: NORMAL, FIRE, WATER, ELECTRIC, GRASS, ICE, FIGHTING, POISON, GROUND, FLYING, PSYCHIC, BUG, ROCK, GHOST, DRAGON, DARK, STEEL, FAIRY"
order: 3000
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Volt Tackle",
      "description": "A super electric-charged bash. 1/3 of the damage is taken as recoil",
      "damageCategory": "PHYSICAL",
      "type": "ELECTRIC",
      "basePower": 120,
      "powerPoints": 24,
      "accuracy": 100
    }

$kind: http-request
name: Update Move by Name
method: PATCH
url: '{{baseUrl}}/api/moves/:name'
description: Update a move by name
order: 5000
params:
  - type: path
    key: name
    value: thunderbolt
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Thunderbolt",
      "description": "A strong electric blast that may paralyze the target.",
      "damageCategory": "SPECIAL",
      "type": "ELECTRIC",
      "basePower": 90,
      "powerPoints": 15,
      "accuracy": 100
    }

$kind: http-request
name: Update User by Username
method: PATCH
url: '{{baseUrl}}/api/users/:username'
description: Update a user's username and/or password. All fields are optional.
order: 5000
pathVariables:
  - key: username
    value: ash_ketchum
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "username": "ash_ketchum_updated",
      "password": "newPassword123"
    }

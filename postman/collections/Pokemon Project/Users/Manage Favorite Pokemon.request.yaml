$kind: http-request
name: Manage Favorite Pokemon
method: POST
url: "{{baseUrl}}/api/users/:username/favorites"
description: "Add or remove favorite Pokemon for a user. Action must be one of: ADD, REMOVE"
order: 4000
pathVariables:
  username: Lt. ug
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "pokemon": ["Pikachu", "Pichu"],
      "action": "ADD"
    }
